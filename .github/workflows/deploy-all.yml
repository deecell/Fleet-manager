# =============================================================================
# Deecell Fleet Tracking - Full Deployment Pipeline
# Runs Terraform, then Deploy to AWS, then Deploy Device Manager
# Use for fresh infrastructure or complete redeployments
# =============================================================================

name: Deploy All

on:
  workflow_dispatch:
    inputs:
      run_terraform:
        description: 'Run Terraform first (infrastructure changes)'
        required: true
        type: boolean
        default: true
      terraform_action:
        description: 'Terraform action (only if run_terraform is true)'
        required: false
        type: choice
        options:
          - apply
          - plan
        default: apply

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Job 1: Terraform (Optional)
  # ===========================================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    if: inputs.run_terraform == true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan -var-file=terraform.tfvars

      - name: Terraform Apply
        if: inputs.terraform_action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # ===========================================================================
  # Job 2: Deploy Web App to ECS
  # ===========================================================================
  deploy-app:
    name: Deploy Web App
    runs-on: ubuntu-latest
    needs: [terraform]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECS_CLUSTER: deecell-fleet-production-cluster
      ECS_SERVICE: deecell-fleet
      ECS_TASK_DEFINITION: deecell-fleet-production
      CONTAINER_NAME: deecell-fleet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for service stability
        run: |
          echo "Waiting for ECS service to stabilize..."
          for i in {1..5}; do
            echo "Attempt $i of 5..."
            if aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }}; then
              echo "Service is stable"
              exit 0
            fi
            echo "Still waiting..."
          done
          echo "Service taking longer than expected, continuing..."

      - name: Verify deployment
        run: |
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k "https://app.deecell.com/api/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS - waiting..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

  # ===========================================================================
  # Job 3: Deploy Device Manager to EC2
  # ===========================================================================
  deploy-device-manager:
    name: Deploy Device Manager
    runs-on: ubuntu-latest
    needs: [deploy-app]
    if: always() && needs.deploy-app.result == 'success'
    
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DEVICE_MANAGER_BUCKET: ${{ secrets.DEVICE_MANAGER_BUCKET }}
      ASG_NAME: deecell-fleet-production-device-manager-asg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package Device Manager
        run: |
          cd device-manager
          
          # Generate package-lock.json if missing
          if [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json..."
            npm install --package-lock-only
          fi
          
          mkdir -p package
          cp -r app package/
          cp -r lib package/
          cp -r src package/
          cp -r build package/ 2>/dev/null || echo "No pre-built binaries"
          cp package.json package/
          cp package-lock.json package/
          cp binding.gyp package/
          echo "{\"version\": \"${{ github.sha }}\", \"built\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > package/version.json
          cd package
          zip -r ../device-manager-latest.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          cd device-manager
          aws s3 cp device-manager-latest.zip s3://${{ env.DEVICE_MANAGER_BUCKET }}/device-manager-latest.zip
          echo "Uploaded to S3"

      - name: Get EC2 Instance IDs
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.ASG_NAME }} \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)
          
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found"
            echo "has_instances=false" >> $GITHUB_OUTPUT
          else
            echo "Found instances: $INSTANCE_IDS"
            echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
            echo "has_instances=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSM
        if: steps.get-instances.outputs.has_instances == 'true'
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"
          
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying to instance: $INSTANCE_ID"
            
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["/opt/device-manager/deploy.sh"]' \
              --timeout-seconds 300 \
              --output text \
              --query 'Command.CommandId')
            
            echo "Command ID: $COMMAND_ID"
            
            for i in {1..30}; do
              STATUS=$(aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'CommandInvocations[0].Status' \
                --output text)
              
              echo "Status: $STATUS"
              
              if [ "$STATUS" = "Success" ]; then
                echo "Deployment successful on $INSTANCE_ID"
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
                echo "Deployment failed on $INSTANCE_ID"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
              fi
              
              sleep 10
            done
          done

  # ===========================================================================
  # Job 4: Summary
  # ===========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [terraform, deploy-app, deploy-device-manager]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web App (ECS) | ${{ needs.deploy-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Device Manager (EC2) | ${{ needs.deploy-device-manager.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** https://app.deecell.com" >> $GITHUB_STEP_SUMMARY
