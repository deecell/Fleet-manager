# =============================================================================
# Deecell Fleet Tracking - Terraform Infrastructure Pipeline
# 
# DISABLED: Infrastructure changes are now managed manually via AWS CloudShell
# for improved security (no admin-level permissions in CI/CD).
#
# See SETUP-NOTES.md for instructions on running Terraform manually.
# =============================================================================

name: Terraform (Disabled)

on:
  workflow_dispatch:  # Keep manual trigger for reference only
  # DISABLED - Terraform now runs manually via CloudShell
  # push:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  #     - '.github/workflows/terraform.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # Lock timeout to prevent concurrent apply race conditions
  TF_CLI_ARGS_plan: "-lock-timeout=5m"
  TF_CLI_ARGS_apply: "-lock-timeout=5m"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ===========================================================================
  # Job 1: Terraform Plan
  # ===========================================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan \
            -var="db_password=${{ secrets.TF_VAR_DB_PASSWORD }}" \
            -var="session_secret=${{ secrets.TF_VAR_SESSION_SECRET }}" \
            -var="admin_password=${{ secrets.TF_VAR_ADMIN_PASSWORD }}" \
            -var="ecr_repository_url=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}" \
            -var="domain_name=app.deecell.com"
          exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          # Exit code 0 = no changes, 1 = error, 2 = changes pending
          if [ $exitcode -eq 1 ]; then
            exit 1
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Format and Style: \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization: \`${{ steps.init.outcome }}\`
            #### Terraform Validation: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        if: steps.plan.outputs.exitcode == '2'
        with:
          name: tfplan
          path: terraform/tfplan

      - name: No Changes Detected
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No infrastructure changes detected."

  # ===========================================================================
  # Job 2: Terraform Apply (only on main branch push/dispatch with changes)
  # ===========================================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    # Only apply if there are changes (exitcode 2) and on main branch
    if: |
      needs.plan.outputs.plan_exitcode == '2' && 
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Verify State
        run: |
          echo "Verifying Terraform state..."
          terraform state list | head -20
          echo "..."
          echo "Total resources: $(terraform state list | wc -l)"
